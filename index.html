<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <header>
            <h1><i class="fas fa-tasks"></i> TaskMaster Pro</h1>
            <p class="tagline">Organize your life, one task at a time</p>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
                <i class="fas fa-moon"></i>
            </button>
        </header>
        
        <main>
            <div class="sidebar">
                <div class="filters">
                    <h2><i class="fas fa-filter"></i> Filters</h2>
                    <ul id="categoryFilters">
                        <li data-category="all" class="active"><i class="fas fa-layer-group"></i> All Tasks</li>
                        <li data-category="work"><i class="fas fa-briefcase"></i> Work</li>
                        <li data-category="personal"><i class="fas fa-user"></i> Personal</li>
                        <li data-category="shopping"><i class="fas fa-shopping-cart"></i> Shopping</li>
                        <li data-category="other"><i class="fas fa-ellipsis-h"></i> Other</li>
                    </ul>
                    <div class="status-filters">
                        <button id="showAll" class="active">All</button>
                        <button id="showActive">Active</button>
                        <button id="showCompleted">Completed</button>
                    </div>
                </div>
                <div class="stats">
                    <h2><i class="fas fa-chart-pie"></i> Statistics</h2>
                    <div class="progress-container">
                        <div id="progressBar" class="progress-bar" style="width: 0%"></div>
                    </div>
                    <p>Total Tasks: <span id="totalTasks">0</span></p>
                    <p>Completed: <span id="completedTasks">0</span></p>
                    <p>Pending: <span id="pendingTasks">0</span></p>
                </div>
            </div>
        
            <div class="content">
                <div class="task-form">
                    <input type="text" id="taskInput" placeholder="What needs to be done?" autofocus>
                    <div class="task-options">
                        <select id="taskCategory">
                            <option value="work">Work</option>
                            <option value="personal">Personal</option>
                            <option value="shopping">Shopping</option>
                            <option value="other">Other</option>
                        </select>
                        <select id="taskPriority">
                            <option value="low">Low Priority</option>
                            <option value="medium">Medium Priority</option>
                            <option value="high">High Priority</option>
                        </select>
                        <input type="date" id="taskDueDate">
                        <button id="addTaskBtn"><i class="fas fa-plus"></i> Add Task</button>
                    </div>
                </div>
                
                <div class="task-container">
                    <h2><i class="fas fa-list-check"></i> My Tasks</h2>
                    <ul id="taskList" class="task-list"></ul>
                </div>
                
                <div class="task-actions">
                    <button id="clearCompletedBtn"><i class="fas fa-check-double"></i> Clear Completed</button>
                    <button id="clearAllBtn"><i class="fas fa-trash"></i> Clear All</button>
                </div>
            </div>
        </main>
        
        <footer>
            <p><i class="fas fa-arrows-up-down-left-right"></i> Drag and drop tasks to reorder • Double-click to edit</p>
            <p class="copyright">TaskMaster Pro &copy; <span id="currentYear"></span></p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
